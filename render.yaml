# Atlas en Render (Blueprint)
#
# Uso: Render Dashboard → New → Blueprint → conecta el repo → Render detecta este fichero.
# Crea el Web Service y la base de datos PostgreSQL a la vez.
#
# Después del primer deploy hay que rellenar a mano las variables marcadas como
# sync: false y ejecutar la migración (ver DEPLOY-RENDER.md).

services:
  - type: web
    name: atlas
    runtime: node
    region: frankfurt # Europa, cerca de España
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      # Clasificación automática con IA (Groq). Sin ella, Atlas usa el
      # clasificador heurístico por palabras clave: funciona, pero peor.
      - key: GROQ_API_KEY
        sync: false
      # Avisos por email en incidencias urgentes (Resend). Opcional.
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: atlas-db
    plan: starter
    region: frankfurt
    postgresMajorVersion: "17"
